<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Appointments</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #0074cc;
      color: white;
    }
    button {
      padding: 6px 12px;
      color: white;
      background-color: red;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: darkred;
    }
  </style>
</head>
<body>
  <h2>All Appointments</h2>
  <table id="appointmentsTable">
    <thead>
      <tr>
        <th>Email</th>
        <th>Doctor</th>
        <th>Date</th>
        <th>Time</th>
        <th>Reason</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be inserted here -->
    </tbody>
  </table>

  <script>
    async function fetchAppointments() {
      const res = await fetch("http://localhost:3001/api/appointments/all");
      const appointments = await res.json();

      const tableBody = document.querySelector("#appointmentsTable tbody");
      tableBody.innerHTML = "";

      appointments.forEach((appt) => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${appt.userEmail}</td>
          <td>${appt.doctorName}</td>
          <td>${appt.date}</td>
          <td>${appt.time}</td>
          <td>${appt.reason}</td>
          <td><button onclick="deleteAppointment('${appt._id}')">Delete</button></td>
        `;

        tableBody.appendChild(row);
      });
    }

    async function deleteAppointment(id) {
      if (!confirm("Are you sure you want to delete this appointment?")) return;

      try {
        const res = await fetch(`http://localhost:3001/api/Appointment/${id}`, {
          method: "DELETE",
        });

        const result = await res.json();
        alert(result.message);
        fetchAppointments(); // Refresh table
      } catch (err) {
        alert("Error deleting appointment.");
      }
    }

    fetchAppointments();
  </script>
</body>
</html>
