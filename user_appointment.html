<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Appointment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 400px;
    }
    h2 {
      text-align: center;
      color: #0074cc;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0074cc;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fa3;
    }
    #message {
      text-align: center;
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Book Appointment</h2>
    <form id="appointmentForm">
      <input type="email" id="email" placeholder="Your Email" required />
      <input type="text" id="doctorName" placeholder="Doctor Name" required />
      <input type="date" id="date" required />
      <input type="time" id="time" required />
      <textarea id="reason" placeholder="Reason for Appointment" rows="4" required></textarea>
      <button type="submit">Submit Appointment</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    document.getElementById("appointmentForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const doctorName = document.getElementById("doctorName").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const reason = document.getElementById("reason").value;
      const message = document.getElementById("message");

      try {
        const res = await fetch("http://localhost:3001/api/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userEmail: email, doctorName, date, time, reason }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        message.style.color = "green";
        message.textContent = "Appointment booked successfully!";
        document.getElementById("appointmentForm").reset();
      } catch (error) {
        message.style.color = "red";
        message.textContent = error.message || "Error booking appointment.";
      }
    });
  </script>
</body>
</html>
